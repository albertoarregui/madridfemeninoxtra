name: Vídeos resumen

# Busca cada día el vídeo resumen de los partidos recientes y lo guarda en la base de datos.
# Secretos necesarios (GitHub → Settings → Secrets and variables → Actions):
#   TURSO_DATABASE_URL, TURSO_AUTH_TOKEN, CACHE_REVALIDATION_SECRET
#   YOUTUBE_API_KEY (opcional pero recomendado: sin ella solo se revisan los RSS)
on:
  schedule:
    - cron: '0 8,20 * * *'   # 09:00 y 21:00 (hora peninsular de invierno)
  workflow_dispatch:
    inputs:
      historico:
        description: 'Buscar en todos los partidos (gasta cuota de la API)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node scripts/videos/buscar-resumenes.mjs ${{ inputs.historico && '--historico' || '' }}
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          CACHE_REVALIDATION_SECRET: ${{ secrets.CACHE_REVALIDATION_SECRET }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
