name: SEO overhaul one-off

on:
  push:
    branches:
      - seo-overhaul-2026-09-29

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      PUPPETEER_SKIP_DOWNLOAD: "true"
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: seo-overhaul-2026-09-29
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply SEO overhaul
        run: node scripts/seo-overhaul.mjs

      - name: Run tests
        run: npm test

      - name: Commit validated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: complete MFX SEO overhaul"
          git push origin HEAD:seo-overhaul-2026-09-29
