name: Importar partido de Sofascore

# Importa los JSON de Sofascore que se suben a datos/sofascore/ (los genera ChatGPT con el prompt
# de scripts/sofascore/PROMPT_CHATGPT.md). Cada partido se valida antes de escribir; los que se
# importan bien se borran de la carpeta y los que fallan se quedan con el motivo en el registro.
# Secretos: TURSO_DATABASE_URL, TURSO_AUTH_TOKEN, CACHE_REVALIDATION_SECRET
on:
  push:
    branches: [main]
    paths: ['datos/sofascore/**.json']
  workflow_dispatch:
    inputs:
      simulacion:
        description: 'Solo comprobar, sin escribir en la base de datos'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: importar-sofascore
  cancel-in-progress: false

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Importar
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          CACHE_REVALIDATION_SECRET: ${{ secrets.CACHE_REVALIDATION_SECRET }}
          SIMULACION: ${{ inputs.simulacion && 'true' || 'false' }}
        run: |
          shopt -s nullglob
          ok=0; fallos=0
          for f in datos/sofascore/*.json; do
            echo "::group::$f"
            if [ "$SIMULACION" = "true" ]; then
              node scripts/sofascore/importar-partido.mjs "$f" --dry && ok=$((ok+1)) || fallos=$((fallos+1))
            elif node scripts/sofascore/importar-partido.mjs "$f" --sin-cache; then
              git rm -q "$f"; ok=$((ok+1))
            else
              echo "::error file=$f::No se ha importado; revisa el registro"; fallos=$((fallos+1))
            fi
            echo "::endgroup::"
          done
          echo "Importados: $ok · con problemas: $fallos"
          if [ "$SIMULACION" != "true" ] && [ "$ok" -gt 0 ]; then
            node scripts/revalidar-cache.mjs partidos alineaciones goles_y_asistencias goles_rival goles_propia tarjetas tarjetas_rival \
              penaltis_fallados tanda_penaltis estadisticas_partidos estadisticas_jugadoras jugadoras estadisticas_periodos \
              tiros posiciones_medias dominio_partido mapas_calor
            git config user.name "github-actions[bot]"
            git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
            git commit -q -m "Sofascore: $ok partido(s) importado(s)"
            git push
          fi
          [ "$fallos" -eq 0 ]
